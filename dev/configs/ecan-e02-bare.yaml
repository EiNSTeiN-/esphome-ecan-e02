substitutions:
  name: ecan-e02
  friendly_name: ECAN E02

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ECAN-E02 ESP32-U4WD bare serial bring-up"
  project:
    name: local.ecan_e02
    version: "0.1.0"
  min_version: 2026.5.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../components
    components: [ecan_e02]

logger:
  level: DEBUG
  baud_rate: 115200

ecan_e02:
  id: board
  update_interval: 30s

button:
  - platform: restart
    name: ${friendly_name} Restart
    disabled_by_default: true

sensor:
  - platform: uptime
    name: ${friendly_name} Uptime
    disabled_by_default: true

text_sensor:
  - platform: version
    name: ${friendly_name} ESPHome Version
    disabled_by_default: true
